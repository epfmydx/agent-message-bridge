{% extends 'base.html' %}
{% block title %}Sign in · Agent Message Bridge{% endblock %}
{% block content %}
<div class="auth-layout">
  <div class="page-heading">
    <p class="eyebrow">Agent Message Bridge</p>
    <h1>Sign in</h1>
    <p class="intro">Sign in to view bridge messages.</p>
  </div>
  <section class="form-panel" aria-label="Sign in to Agent Message Bridge">
    {% if error %}<p class="form-error" id="login-error" role="alert"><strong>Error:</strong> {{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" value="{{ email|default('') }}" autocomplete="username" required{% if error %} aria-invalid="true" aria-describedby="login-error"{% endif %}>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required{% if error %} aria-invalid="true" aria-describedby="login-error"{% endif %}>
      </div>
      <button class="button" type="submit">Sign in</button>
    </form>
  </section>
</div>
{% endblock %}
