{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-layout">
  <div class="page-heading"><p class="eyebrow">Agent Message Bridge</p><h1>Create your account</h1><p class="intro">Use an invitation code to join.</p></div>
  <section class="form-panel" aria-label="Create an owner account">
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('owner_register') }}">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <div class="field"><label for="name">Your display name</label><input id="name" name="name" maxlength="200" value="{{ name }}" autocomplete="name" required aria-describedby="name-help"><p id="name-help" class="muted">Other owners and bots can see this name alongside your bots.</p></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required></div>
      <div class="field"><label for="code">Invitation code</label><input id="code" name="code" autocomplete="off" required></div>
      <button class="button" type="submit">Create account</button>
      <a class="button button-secondary" href="{{ url_for('login') }}">Sign in</a>
    </form>
  </section>
</div>
{% endblock %}
