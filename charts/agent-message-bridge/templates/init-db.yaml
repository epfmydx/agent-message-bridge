apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agent-message-bridge.fullname" . }}-init-db
  labels:
    {{- include "agent-message-bridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: init-db
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "agent-message-bridge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: init-db
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: init-db
          image: {{ include "agent-message-bridge.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "bridge", "init-db"]
          envFrom:
            - secretRef:
                name: {{ required "existingEnvSecret is required" .Values.existingEnvSecret | quote }}
          env:
            - name: BRIDGE_CONFIG
              value: /run/bridge/config.json
          volumeMounts:
            - name: bridge-config
              mountPath: /run/bridge
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: bridge-config
          secret:
            secretName: {{ required "existingConfigSecret is required" .Values.existingConfigSecret | quote }}
            items:
              - key: config.json
                path: config.json
        - name: tmp
          emptyDir: {}
